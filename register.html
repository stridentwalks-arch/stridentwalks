<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - Strident Walks</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="navbar">
    <div class="logo-container">
        <img src="images/logo.png" class="logo" alt="Logo">
    </div>

    <div class="topnav">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About Us</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="virtual-walks.html">Virtual Walks</a></li>
        </ul>

        <!-- Dynamic login status -->
        <span id="nav-user" class="nav-user"></span>

        <script>
            fetch("/whoami")
                .then(res => res.json())
                .then(data => {
                    const navUser = document.getElementById("nav-user");

                    if (data.user) {
                        navUser.innerHTML = `Welcome, ${data.user} | <a href="/logout">Logout</a>`;
                    } else {
                        navUser.innerHTML = `<a href="login.html">Login</a> | <a href="register.html">Register</a>`;
                    }
                });
        </script>
    </div>
</header>

<div class="login-container">
    <h2>Create an Account</h2>

    <form action="/register" method="POST">
        <label for="username">Choose a Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Choose a Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

</body>
</html>
